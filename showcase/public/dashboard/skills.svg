<svg xmlns="http://www.w3.org/2000/svg" width="440" height="230" viewBox="0 0 440 230" role="img"><title>Especialidades de ingeniería y automatización</title><style>text{font-family:Arial,Helvetica,sans-serif;fill:#edf3f8}.title{font-size:18px;font-weight:700;letter-spacing:-.4px}.muted{fill:#a3b3c4;font-size:12px}.value{font-size:40px;font-weight:700;letter-spacing:-1.5px}.label{font-size:13px}.orbit{transform-origin:348px 96px;animation:orbit 19s linear infinite}.orbit-back{transform-origin:348px 96px;animation:orbit 27s linear infinite reverse}.float{animation:float 4s cubic-bezier(.77,0,.175,1) infinite alternate}.trace{animation:trace 7s linear infinite}.spark{animation:spark 2.8s ease-in-out infinite alternate}.bar{transform-box:fill-box;transform-origin:left;animation:bar 6s cubic-bezier(.77,0,.175,1) infinite}.scan{animation:scan 8s linear infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes float{to{transform:translateY(-5px)}}@keyframes trace{to{stroke-dashoffset:-120}}@keyframes spark{to{opacity:.35}}@keyframes bar{0%,100%{opacity:.8}50%{opacity:1}}@keyframes scan{0%,100%{opacity:0}40%,65%{opacity:.8}}@media(prefers-reduced-motion:reduce){.orbit,.orbit-back,.float,.trace,.spark,.bar,.scan{animation:none}}</style><rect x=".5" y=".5" width="439" height="229" rx="16" fill="#0c1420" stroke="#28394c"/><text x="26" y="32" class="title">De la interacción a la operación</text><g fill="none" stroke="#44576d" stroke-width="1.5"><path d="M72 88H220V154H366"/><path d="M220 88H366"/></g><path class="trace" d="M72 88H220V154H366" fill="none" stroke="#ad98ef" stroke-width="2" stroke-dasharray="8 22"/><circle class="spark" cx="72" cy="88" r="7" fill="#64caff" style="animation-delay:0s"/><text x="72" y="113" text-anchor="middle" class="muted">Telegram</text><circle class="spark" cx="220" cy="88" r="7" fill="#b6a1ff" style="animation-delay:0.4s"/><text x="220" y="113" text-anchor="middle" class="muted">Python + IA</text><circle class="spark" cx="366" cy="88" r="7" fill="#91d2b3" style="animation-delay:0.8s"/><text x="366" y="113" text-anchor="middle" class="muted">Linux / VPS</text><circle class="spark" cx="72" cy="154" r="7" fill="#f4ae84" style="animation-delay:1.2000000000000002s"/><text x="72" y="179" text-anchor="middle" class="muted">React / 3D</text><circle class="spark" cx="220" cy="154" r="7" fill="#b6a1ff" style="animation-delay:1.6s"/><text x="220" y="179" text-anchor="middle" class="muted">n8n / APIs</text><circle class="spark" cx="366" cy="154" r="7" fill="#91d2b3" style="animation-delay:2s"/><text x="366" y="179" text-anchor="middle" class="muted">Servicios</text><text x="26" y="211" class="muted">Bots · automatización · infraestructura · web interactiva</text></svg>