<svg xmlns="http://www.w3.org/2000/svg" width="440" height="230" viewBox="0 0 440 230" role="img"><title>Actividad real de Pablo Sánchez</title><style>text{font-family:Arial,Helvetica,sans-serif;fill:#edf3f8}.title{font-size:18px;font-weight:700;letter-spacing:-.4px}.muted{fill:#a3b3c4;font-size:12px}.value{font-size:40px;font-weight:700;letter-spacing:-1.5px}.label{font-size:13px}.orbit{transform-origin:348px 96px;animation:orbit 19s linear infinite}.orbit-back{transform-origin:348px 96px;animation:orbit 27s linear infinite reverse}.float{animation:float 4s cubic-bezier(.77,0,.175,1) infinite alternate}.trace{animation:trace 7s linear infinite}.spark{animation:spark 2.8s ease-in-out infinite alternate}.bar{transform-box:fill-box;transform-origin:left;animation:bar 6s cubic-bezier(.77,0,.175,1) infinite}.scan{animation:scan 8s linear infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes float{to{transform:translateY(-5px)}}@keyframes trace{to{stroke-dashoffset:-120}}@keyframes spark{to{opacity:.35}}@keyframes bar{0%,100%{opacity:.8}50%{opacity:1}}@keyframes scan{0%,100%{opacity:0}40%,65%{opacity:.8}}@media(prefers-reduced-motion:reduce){.orbit,.orbit-back,.float,.trace,.spark,.bar,.scan{animation:none}}</style><rect x=".5" y=".5" width="439" height="229" rx="16" fill="#0c1420" stroke="#28394c"/><text x="26" y="32" class="title">El código, en movimiento.</text><text x="26" y="94" class="value" style="fill:#72c7ff">59</text><text x="26" y="118" class="muted">contribuciones / 12 meses</text><text x="258" y="94" class="value" style="fill:#d4c2ff">7</text><text x="258" y="118" class="muted">repos públicos propios</text><path d="M26 140H414" stroke="#28394c"/><text x="26" y="169" class="label">5 días con actividad</text><text x="26" y="194" class="muted">7 estrellas en repositorios propios</text><g class="orbit"><circle cx="348" cy="96" r="48" fill="none" stroke="#627c9b" stroke-dasharray="2 9" opacity=".25"/></g><text x="414" y="211" text-anchor="end" class="muted">GitHub · 2026-10-31</text></svg>