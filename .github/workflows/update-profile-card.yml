name: Update live contribution card

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-profile-card.yml"
      - "scripts/generate-activity-card.mjs"
      - "scripts/generate-dashboard.mjs"

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve public contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f query='query { user(login: "pablo2611") { contributionsCollection { contributionCalendar { totalContributions weeks { firstDay contributionDays { date weekday contributionCount contributionLevel } } } } repositories(first:100, ownerAffiliations:OWNER, privacy:PUBLIC, isFork:false) { nodes { name stargazerCount languages(first:8, orderBy:{field:SIZE,direction:DESC}) { edges { size node { name color } } } } } } }' > calendar.json
      - name: Render activity card
        run: node scripts/generate-activity-card.mjs calendar.json assets/activity-heatmap.svg
      - name: Render animated dashboard
        run: node scripts/generate-dashboard.mjs calendar.json
      - name: Commit changed card
        run: |
          git diff --quiet || (git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add assets/activity-heatmap.svg assets/activity-heatmap-mobile.svg assets/dashboard-*.svg showcase/public/dashboard/*.svg README.md && git commit -m "Update live contribution card" && git push)
