<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Technology cloud</title><desc id="desc">Animated visual cloud of Pablo Sánchez's languages, frameworks, cloud services, testing tools and developer tooling.</desc>
  <defs>
    <radialGradient id="bg"><stop stop-color="#211d42"/><stop offset="1" stop-color="#0d0e18"/></radialGradient>
    <radialGradient id="core"><stop stop-color="#8f82ff" stop-opacity=".42"/><stop offset="1" stop-color="#7c6cff" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
    <style>.tag{fill:#e8e6ff;font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:.2px}.sub{fill:#aaa6c2;font:11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.head{fill:#fff;font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}</style>
  </defs>
  <rect width="760" height="360" rx="22" fill="url(#bg)" stroke="#ffffff" stroke-opacity=".13"/>
  <text x="30" y="42" class="head">Technology cloud</text><text x="30" y="61" class="sub">Languages, frameworks, cloud, testing, and developer tooling</text>
  <circle cx="380" cy="205" r="144" fill="none" stroke="#7c6cff" stroke-opacity=".12" stroke-dasharray="3 9"><animateTransform attributeName="transform" type="rotate" from="0 380 205" to="360 380 205" dur="36s" repeatCount="indefinite"/></circle>
  <circle cx="380" cy="205" r="98" fill="none" stroke="#7c6cff" stroke-opacity=".17" stroke-dasharray="2 7"><animateTransform attributeName="transform" type="rotate" from="360 380 205" to="0 380 205" dur="24s" repeatCount="indefinite"/></circle>
  <circle cx="380" cy="205" r="78" fill="url(#core)" filter="url(#blur)"><animate attributeName="opacity" values=".55;1;.55" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="380" cy="205" r="48" fill="#17152a" stroke="#9b8fff" stroke-opacity=".45"/><text x="380" y="201" text-anchor="middle" class="head" font-size="13">TECH</text><text x="380" y="220" text-anchor="middle" class="sub">STACK</text>
