<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title description">
  <title id="title">Contribution activity</title>
  <desc id="description">An animated violet contribution heatmap card.</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#161326"/><stop offset="1" stop-color="#0d0e18"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#7c6cff" stop-opacity=".32"/><stop offset="1" stop-color="#7c6cff" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="760" height="300" rx="22" fill="url(#surface)" stroke="#ffffff" stroke-opacity=".13"/>
  <circle cx="72" cy="35" r="80" fill="url(#glow)" filter="url(#blur)"><animate attributeName="opacity" values=".35;.9;.35" dur="4s" repeatCount="indefinite"/></circle>
  <rect x="28" y="27" width="38" height="38" rx="10" fill="#7c6cff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".14"/>
  <path d="M40 53V43m6 10V37m6 16v-7m6 7V40" fill="none" stroke="#b6afff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="80" y="43" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700">Contribution activity</text>
  <text x="80" y="62" fill="#9694a8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">Keep building. Every commit counts.</text>
  <text x="690" y="45" fill="#fff" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25" font-weight="700">2026</text>
  <text x="690" y="63" fill="#9694a8" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">activity pulse</text>
  <g fill="#777184" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10"><text x="56" y="125">Mon</text><text x="56" y="159">Wed</text><text x="56" y="193">Fri</text><text x="96" y="100">Jan</text><text x="216" y="100">Mar</text><text x="336" y="100">May</text><text x="456" y="100">Jul</text><text x="576" y="100">Sep</text></g>
  <g transform="translate(96 110)">
    <defs><pattern id="cells" width="17" height="17" patternUnits="userSpaceOnUse"><rect width="13" height="13" rx="3" fill="#ffffff" fill-opacity=".06"/></pattern></defs>
    <rect width="594" height="115" rx="4" fill="url(#cells)"/>
    <g>
      <rect x="34" y="34" width="13" height="13" rx="3" fill="#7c6cff" fill-opacity=".38"/><rect x="51" y="51" width="13" height="13" rx="3" fill="#7c6cff" fill-opacity=".62"/><rect x="68" y="68" width="13" height="13" rx="3" fill="#a093ff"/>
      <rect x="153" y="17" width="13" height="13" rx="3" fill="#7c6cff" fill-opacity=".48"/><rect x="170" y="34" width="13" height="13" rx="3" fill="#7c6cff" fill-opacity=".82"/><rect x="187" y="51" width="13" height="13" rx="3" fill="#a093ff"/>
      <rect x="289" y="68" width="13" height="13" rx="3" fill="#7c6cff" fill-opacity=".52"/><rect x="306" y="51" width="13" height="13" rx="3" fill="#a093ff"/><rect x="323" y="34" width="13" height="13" rx="3" fill="#7c6cff" fill-opacity=".7"/>
      <rect x="442" y="17" width="13" height="13" rx="3" fill="#a093ff"/><rect x="459" y="34" width="13" height="13" rx="3" fill="#7c6cff" fill-opacity=".7"/><rect x="476" y="51" width="13" height="13" rx="3" fill="#7c6cff" fill-opacity=".4"/>
      <g fill="#b6afff"><rect x="493" y="68" width="13" height="13" rx="3"/><rect x="510" y="51" width="13" height="13" rx="3"/><rect x="527" y="34" width="13" height="13" rx="3"/><rect x="544" y="17" width="13" height="13" rx="3"/></g>
      <animateTransform attributeName="transform" type="translate" values="-6 0;6 0;-6 0" dur="3.8s" repeatCount="indefinite"/>
    </g>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11" fill="#9694a8"><text x="590" y="263">Less</text><text x="690" y="263">More</text></g>
  <g transform="translate(620 252)"><rect width="12" height="12" rx="3" fill="#ffffff" fill-opacity=".08"/><rect x="16" width="12" height="12" rx="3" fill="#7c6cff" fill-opacity=".35"/><rect x="32" width="12" height="12" rx="3" fill="#7c6cff" fill-opacity=".58"/><rect x="48" width="12" height="12" rx="3" fill="#7c6cff" fill-opacity=".8"/></g>
</svg>
