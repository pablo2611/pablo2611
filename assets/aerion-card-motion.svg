    <circle cx="302" cy="108" r="58" fill="none" stroke="#83e8ff" stroke-opacity=".19" stroke-dasharray="2 5"/>
    <path d="M234 151h136M244 161h116M273 136l-24 38m48-38-8 38m18-38 8 38m16-38 24 38" fill="none" stroke="#83e8ff" stroke-opacity=".17"/>
