      <path d="M240 100h14m-19 13h13m104-13h12m-10 13h15" opacity=".63"/>
    </g>
    <g class="coupe" stroke-linejoin="round">
      <path d="M256 107l12-28q2-5 9-6h50q7 1 9 6l12 28m-84 23v8h10l4-8m48 0 4 8h10v-8" fill="#142b3c" stroke="#8edff3" stroke-width="2"/>
      <path d="M278 80h48l9 19h-66z" fill="#234b64" stroke="#79c5da" stroke-width="1.5"/>
      <path d="M244 113l13-13h90l13 13v12q0 6-6 6H250q-6 0-6-6z" fill="#16364a" stroke="#b7f1ff" stroke-width="2.4"/>
