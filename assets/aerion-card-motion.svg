<svg xmlns="http://www.w3.org/2000/svg" width="400" height="218" viewBox="0 0 400 218" role="img" aria-labelledby="title">
  <title id="title">AERION · CONDUCCIÓN 3D</title>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .coupe { animation: approach 4.6s ease-in-out; transform-origin: 302px 109px; }
      .speed { animation: wind 1.15s ease-in-out 4; }
    }
    @keyframes approach {
      0%, 100% { transform: translateY(0) scale(1); }
      45%, 68% { transform: translateY(-8px) scale(1.08); }
    }
    @keyframes wind {
      0% { transform: translateY(-14px); opacity: .1; }
      45% { opacity: 1; }
      100% { transform: translateY(18px); opacity: .1; }
    }
  </style>
  <defs>
    <linearGradient id="card" x2="1" y2="1">
      <stop stop-color="#0e141d"/>
      <stop offset="1" stop-color="#101e2d"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#83e8ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#83e8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="398" height="216" rx="20" fill="url(#card)" stroke="#83e8ff" stroke-opacity=".35"/>
  <rect x="221" y="17" width="162" height="184" rx="14" fill="#101d2a" stroke="#83e8ff" stroke-opacity=".22"/>
  <g aria-hidden="true">
