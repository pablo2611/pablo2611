<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" role="img"><title>Pablo Sánchez — ingeniería de software desde Panamá</title><style>text{font-family:Arial,Helvetica,sans-serif;fill:#edf3f8}.title{font-size:18px;font-weight:700;letter-spacing:-.4px}.muted{fill:#a3b3c4;font-size:12px}.value{font-size:40px;font-weight:700;letter-spacing:-1.5px}.label{font-size:13px}.orbit{transform-origin:348px 96px;animation:orbit 19s linear infinite}.orbit-back{transform-origin:348px 96px;animation:orbit 27s linear infinite reverse}.float{animation:float 4s cubic-bezier(.77,0,.175,1) infinite alternate}.trace{animation:trace 7s linear infinite}.spark{animation:spark 2.8s ease-in-out infinite alternate}.bar{transform-box:fill-box;transform-origin:left;animation:bar 6s cubic-bezier(.77,0,.175,1) infinite}.scan{animation:scan 8s linear infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes float{to{transform:translateY(-5px)}}@keyframes trace{to{stroke-dashoffset:-120}}@keyframes spark{to{opacity:.35}}@keyframes bar{0%,100%{opacity:.8}50%{opacity:1}}@keyframes scan{0%,100%{opacity:0}40%,65%{opacity:.8}}@media(prefers-reduced-motion:reduce){.orbit,.orbit-back,.float,.trace,.spark,.bar,.scan{animation:none}}</style><rect x=".5" y=".5" width="879" height="229" rx="16" fill="#0c1420" stroke="#28394c"/><path d="M28 54H852" stroke="#2a3d51"/><text x="28" y="32" class="muted">pablo2611 / ingeniería de software</text><circle cx="846" cy="27" r="4" fill="#8dd8b5" class="spark"/><text x="34" y="111" style="font-size:43px;font-weight:700;letter-spacing:-1.5px">Pablo <tspan fill="#79caff" style="fill:#79caff">Sánchez</tspan></text><text x="36" y="149" style="font-size:17px;fill:#c9d7e6">Ideas conectadas. Sistemas que responden.</text><text x="36" y="193" class="muted">Panamá · Python · Linux / VPS · experiencias web</text><g transform="translate(390 21)"><g class="orbit"><ellipse cx="348" cy="96" rx="70" ry="43" fill="none" stroke="#77caff" stroke-width="1.5"/><circle cx="418" cy="96" r="6" fill="#77caff"/></g><g class="orbit-back"><ellipse cx="348" cy="96" rx="78" ry="66" fill="none" stroke="#b6a1ff" stroke-dasharray="3 8"/><circle cx="270" cy="96" r="4" fill="#b6a1ff"/></g><g class="float"><path d="m326 80-17 16 17 16m44-32 17 16-17 16m-16-38-12 36" stroke="#d6eeff" stroke-width="4" stroke-linecap="round" fill="none"/></g></g></svg>